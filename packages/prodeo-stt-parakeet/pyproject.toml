[project]
name = "prodeo-stt-parakeet"
version = "0.2.0"
description = "Mjölnir speech-to-text engine backed by NVIDIA Parakeet (ONNX Runtime)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
# Same model NVIDIA ships through NeMo, run on ONNX Runtime instead: numpy +
# onnxruntime rather than the PyTorch stack, so this is an ordinary light
# package. onnxruntime is already here for faster-whisper, Piper, and
# OpenWakeWord. For GPU, swap in onnxruntime-gpu (CUDA) or
# onnxruntime-directml and set the `providers` config key.
dependencies = ["prodeo-mjolnir", "onnx-asr[cpu,hub]>=0.12"]

[project.entry-points."prodeo.plugins"]
parakeet = "prodeo_stt_parakeet:manifest"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prodeo_stt_parakeet"]

[tool.uv.sources]
prodeo-mjolnir = { workspace = true }
