[project]
name = "prodeo-ccan"
version = "0.1.0"
description = "Prodeo Command Center Agent Node - the per-machine daemon (ADR-0020)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["prodeo", "cryptography>=42"]

[project.scripts]
prodeo-ccan = "prodeo_ccan.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prodeo_ccan"]

[tool.uv.sources]
prodeo = { workspace = true }
